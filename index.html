<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Franco Fit - Preparación Física</title>
    
    <!-- Hojas de Estilo Vite / Tailwind -->
    <link rel="stylesheet" href="/src/style.css">
</head>
<body class="bg-slate-950 text-slate-100 antialiased min-h-screen selection:bg-amber-500 selection:text-slate-950 font-sans">

    <!-- CONTENEDOR PRINCIPAL DE MONTAJE (VITE APP) -->
    <div id="app"></div>

    <!-- MODAL REUTILIZABLE PARA AGREGAR / EDITAR EJERCICIOS -->
    <div id="exercise-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-md p-5 space-y-4 shadow-2xl overflow-y-auto max-h-[90vh]">
            <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                <h3 id="modal-title" class="text-sm font-black text-amber-400 uppercase tracking-wider flex items-center gap-2">
                    <i data-feather="plus-circle" class="w-4 h-4"></i> Agregar Ejercicio
                </h3>
                <button onclick="window.closeModal()" class="text-slate-400 hover:text-white p-1 rounded-lg">
                    <i data-feather="x" class="w-5 h-5"></i>
                </button>
            </div>

            <form id="exercise-modal-form" onsubmit="event.preventDefault(); window.saveExerciseFromModal();" class="space-y-3">
                <input type="hidden" id="modal-ex-id">

                <div>
                    <label class="block text-[10px] font-bold text-slate-400 mb-1">Categoría</label>
                    <select id="modal-ex-category" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs text-white font-semibold focus:outline-none focus:border-amber-500">
                        <option value="Peso Libre">Peso Libre</option>
                        <option value="Máquinas">Máquinas</option>
                        <option value="Mano de Obra / Calistenia">Calistenia / Peso Corporal</option>
                        <option value="Cardio">Cardio</option>
                        <option value="Flexibilidad">Flexibilidad</option>
                    </select>
                </div>

                <div>
                    <label class="block text-[10px] font-bold text-slate-400 mb-1">Nombre del Ejercicio</label>
                    <input type="text" id="modal-ex-name" required placeholder="Ej. Sentadilla Trasera" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs text-white font-semibold focus:outline-none focus:border-amber-500">
                </div>

                <div>
                    <label class="block text-[10px] font-bold text-slate-400 mb-1">URL de Demostración (YouTube / Video / GIF)</label>
                    <input type="url" id="modal-ex-media-url" placeholder="https://..." class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs text-white font-semibold focus:outline-none focus:border-amber-500">
                </div>

                <div class="grid grid-cols-3 gap-2">
                    <div>
                        <label class="block text-[10px] font-bold text-slate-400 mb-1">Tipo</label>
                        <select id="modal-ex-type" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2 text-xs text-white font-semibold focus:outline-none">
                            <option value="Serie Simple">Serie Simple</option>
                            <option value="Bi-set">Bi-set</option>
                            <option value="Tri-set">Tri-set</option>
                            <option value="Superserie">Superserie</option>
                            <option value="Drop-set">Drop-set</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-slate-400 mb-1">Series</label>
                        <input type="number" id="modal-ex-sets" min="1" max="20" value="4" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2 text-xs text-white font-bold text-center focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-slate-400 mb-1">Reps</label>
                        <input type="text" id="modal-ex-reps" value="10-12" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2 text-xs text-white font-bold text-center focus:outline-none">
                    </div>
                </div>

                <!-- CRONOMETRÍA Y TIEMPOS -->
                <div class="bg-slate-950 p-3 rounded-xl border border-slate-800 space-y-2">
                    <span class="text-[10px] font-bold text-amber-400 block uppercase tracking-wider">Cronometría y Pausas</span>
                    
                    <div class="grid grid-cols-3 gap-2">
                        <div>
                            <span class="block text-[9px] text-slate-400 mb-0.5">Ejecución</span>
                            <div class="flex gap-1">
                                <select id="modal-ex-exec-min" class="w-1/2 bg-slate-900 border border-slate-800 rounded-lg p-1 text-[10px] text-white font-bold"></select>
                                <select id="modal-ex-exec-sec" class="w-1/2 bg-slate-900 border border-slate-800 rounded-lg p-1 text-[10px] text-white font-bold"></select>
                            </div>
                        </div>

                        <div>
                            <span class="block text-[9px] text-slate-400 mb-0.5">Desc. Rep</span>
                            <div class="flex gap-1">
                                <select id="modal-ex-rep-rest-min" class="w-1/2 bg-slate-900 border border-slate-800 rounded-lg p-1 text-[10px] text-white font-bold"></select>
                                <select id="modal-ex-rep-rest-sec" class="w-1/2 bg-slate-900 border border-slate-800 rounded-lg p-1 text-[10px] text-white font-bold"></select>
                            </div>
                        </div>

                        <div>
                            <span class="block text-[9px] text-slate-400 mb-0.5">Desc. Serie</span>
                            <div class="flex gap-1">
                                <select id="modal-ex-set-rest-min" class="w-1/2 bg-slate-900 border border-slate-800 rounded-lg p-1 text-[10px] text-white font-bold"></select>
                                <select id="modal-ex-set-rest-sec" class="w-1/2 bg-slate-900 border border-slate-800 rounded-lg p-1 text-[10px] text-white font-bold"></select>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="pt-2 flex gap-2">
                    <button type="button" onclick="window.closeModal()" class="w-1/2 bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-bold py-2.5 rounded-xl transition">
                        Cancelar
                    </button>
                    <button type="submit" class="w-1/2 bg-amber-500 hover:bg-amber-400 text-slate-950 text-xs font-black py-2.5 rounded-xl shadow-lg transition active:scale-95">
                        Guardar Ejercicio
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- CARGA DE MÓDULO PRINCIPAL VITE -->
    <script type="module" src="/src/main.js"></script>
</body>
</html>
